[project]
name = "zarr-inline-crosscheck"
version = "0.1.0"
description = "Cross-implementation conformance harness for zarr-inline (not published)"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "zarr-inline",
    "zarr>=3.1.0",
    "zarr-metadata>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24.0", "hypothesis>=6.135"]

[tool.uv.sources]
zarr-inline = { path = "../../python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_inline_crosscheck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
