<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zarr-inline browser</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #20252e;
    --border: #2a3038;
    --text: #d7dde5;
    --muted: #8b96a5;
    --accent: #4da3ff;
    --ok: #57c785;
    --error: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header h1 code { color: var(--accent); font-family: var(--mono); }
  button, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  #status { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .segmented button { border: none; border-radius: 0; }
  .segmented button.active { background: var(--accent); color: #0d1117; }
  #status .ok { color: var(--ok); }
  #status .bad { color: var(--error); cursor: help; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 300px minmax(340px, 460px) 1fr;
    min-height: 0;
  }
  main > * { min-width: 0; min-height: 0; overflow: auto; }
  #document-panel { padding: 10px 14px; display: none; }
  main[data-view="json"] { grid-template-columns: 1fr; }
  main[data-view="json"] > #tree-panel,
  main[data-view="json"] > #json-panel,
  main[data-view="json"] > #display-panel { display: none; }
  main[data-view="json"] > #document-panel { display: block; }
  #document-panel .json-editor textarea { height: calc(100vh - 140px); max-height: none; }
  #json-panel { border-right: 1px solid var(--border); padding: 10px 12px; }
  #display-panel { padding: 10px 12px; display: flex; flex-direction: column; }

  /* left pane: breadcrumb + member list */
  #tree-panel { border-right: 1px solid var(--border); background: var(--panel); padding: 10px 12px; }
  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 8px;
  }
  .breadcrumb a { color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .breadcrumb a:hover { background: var(--panel-2); }
  .breadcrumb a.current { color: var(--text); }
  .breadcrumb span { color: var(--muted); }

  /* the flat list idiom (left pane members, JSON panel keys) */
  .list-search {
    width: 100%;
    background: #12151a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font: 12px var(--mono);
    margin-bottom: 6px;
  }
  .list-search:focus { outline: none; border-color: var(--accent); }
  .flat-list { list-style: none; margin: 0; padding: 0; }
  .list-row { border-radius: 6px; }
  .list-row-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    border-radius: 6px;
    cursor: pointer;
  }
  .list-row-head:hover { background: var(--panel-2); }
  .list-row.selected > .list-row-head { background: var(--panel-2); outline: 1px solid var(--accent); }
  .list-name { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .list-detail { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .list-expansion { padding: 4px 2px 8px; }
  .list-more { font-size: 12px; }
  .add-key-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-key-row input { flex: 1; margin-bottom: 0; }
  button.danger { color: var(--error); border-color: #5a2f2f; }
  .tag-group { color: var(--accent); border-color: #2f4a6a; }
  .tag-array-node { color: var(--ok); border-color: #2f5a4d; }
  .tag-object { color: var(--accent); border-color: #2f4a6a; }
  .tag-array { color: var(--ok); border-color: #2f5a4d; }
  .tag-b64 { color: #d8a657; border-color: #5a4a2f; }
  .tag-other { color: var(--error); border-color: #5a2f2f; }

  /* JSON panel */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 12px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .section-header:first-child { margin-top: 0; }
  .section-header code { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .hint { color: var(--muted); }
  .chip {
    font: 10px var(--mono);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 7px;
    white-space: nowrap;
  }
  .json-editor { position: relative; }
  .json-editor-layer, .json-editor textarea {
    box-sizing: border-box;
    width: 100%;
    margin: 0;
    font: 12px/1.5 var(--mono);
    padding: 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    white-space: pre;
    tab-size: 2;
  }
  .json-editor-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #12151a;
    color: var(--text);
    pointer-events: none;
  }
  .json-editor-layer code { font: inherit; }
  .json-editor textarea {
    position: relative;
    display: block;
    min-height: 130px;
    max-height: 45vh;
    resize: vertical;
    overflow: auto;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    border-color: var(--border);
  }
  .json-editor textarea:focus { outline: none; border-color: var(--accent); }
  .json-editor textarea::selection { background: rgba(77, 163, 255, 0.30); }
  .j-key { color: #7fb4ff; }
  .j-str { color: #a9d98b; }
  .j-num { color: #e8c07a; }
  .j-lit { color: #c39ce8; }
  .j-pun { color: #8b96a5; }
  pre.attrs .j-key { color: #7fb4ff; }
  .editor-buttons { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; }
  .editor-status { font: 12px var(--mono); color: var(--muted); }
  .editor-status.ok { color: var(--ok); }
  .editor-status.error { color: var(--error); }

  /* display panel */
  .node-title { margin: 0 0 8px; font-size: 15px; }
  .node-title code { font-family: var(--mono); color: var(--accent); }
  .node-title .sub { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card .name { font-family: var(--mono); font-size: 13px; }
  .card .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  pre.attrs {
    background: #12151a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font: 12px/1.5 var(--mono);
    overflow: auto;
    max-height: 30vh;
  }

  /* viewer */
  .viewer-controls { flex: none; margin-bottom: 8px; }
  .dim-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .dim-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .dim-row code { font-family: var(--mono); min-width: 2.5em; text-align: right; }
  .dim-name { font-family: var(--mono); font-size: 12px; min-width: 7em; color: var(--muted); }
  .range-input { width: 7em; background: #12151a; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; font: 12px var(--mono); }
  .viewer-viewport {
    position: relative;
    flex: 1;
    min-height: 240px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 8px;
    touch-action: none;
    cursor: grab;
  }
  .viewer-viewport:active { cursor: grabbing; }
  .checker {
    background-image:
      linear-gradient(45deg, #20242b 25%, transparent 25%, transparent 75%, #20242b 75%),
      linear-gradient(45deg, #20242b 25%, transparent 25%, transparent 75%, #20242b 75%);
    background-color: #191d23;
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  .viewer-viewport canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    image-rendering: pixelated;
  }
  .viewer-viewport canvas.viewer-overlay {
    width: 100%;
    height: 100%;
    image-rendering: auto;
    pointer-events: none;
  }
  .dim-row label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .viewer-readout {
    flex: none;
    margin-top: 6px;
    font: 12px var(--mono);
    color: var(--muted);
    min-height: 1.4em;
  }
  .value-table { border-collapse: collapse; font: 12px var(--mono); }
  .value-table td { border: 1px solid var(--border); padding: 2px 8px; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.72);
    display: grid;
    place-items: center;
    z-index: 20;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    width: min(680px, 90vw);
  }
  .modal p { margin: 0 0 8px; }
  .modal textarea {
    width: 100%;
    height: 40vh;
    resize: vertical;
    background: #12151a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font: 12px/1.5 var(--mono);
    white-space: pre;
  }
  .drop-active::after {
    content: "drop a zarr-inline .json document";
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(20, 23, 28, 0.85);
    color: var(--accent);
    font-size: 22px;
    z-index: 10;
  }
</style>
</head>
<body>
<header>
  <h1><code>zarr-inline</code> browser</h1>
  <span class="segmented">
    <button id="view-browser" class="active">Browser</button>
    <button id="view-json">JSON</button>
  </span>
  <button id="open">Open…</button>
  <input id="file" type="file" accept=".json,application/json" hidden />
  <button id="paste">Paste…</button>
  <button id="from-url">URL…</button>
  <button id="demo">Demo</button>
  <button id="download">Download</button>
  <button id="copy">Copy JSON</button>
  <button id="copy-link">Copy link</button>
  <span id="status">no document</span>
</header>
<main data-view="browser">
  <aside id="tree-panel"><p class="hint">Open a document to begin.</p></aside>
  <section id="json-panel"><p class="hint">Open a document to begin.</p></section>
  <section id="display-panel"><p class="hint">The selected node is displayed here.</p></section>
  <section id="document-panel"></section>
</main>
<script>
/*__APP__*/
</script>
</body>
</html>
