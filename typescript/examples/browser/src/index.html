<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zarr-inline browser</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #20252e;
    --border: #2a3038;
    --text: #d7dde5;
    --muted: #8b96a5;
    --accent: #4da3ff;
    --ok: #57c785;
    --error: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header h1 code { color: var(--accent); font-family: var(--mono); }
  button, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  #status { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  #status .ok { color: var(--ok); }
  #status .bad { color: var(--error); cursor: help; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 360px minmax(320px, 430px) 1fr;
    min-height: 0;
  }
  main > * { min-width: 0; min-height: 0; overflow: auto; }
  #dag-panel { border-right: 1px solid var(--border); background: var(--panel); }
  #json-panel { border-right: 1px solid var(--border); padding: 10px 12px; }
  #display-panel { padding: 10px 12px; display: flex; flex-direction: column; }

  /* DAG */
  #dag { display: block; }
  #dag .edge { fill: none; stroke: #3b4453; stroke-width: 1.4; }
  #dag .node { cursor: pointer; }
  #dag .node rect { fill: var(--panel-2); stroke: var(--border); stroke-width: 1.2; }
  #dag .node.group rect { fill: #262e3a; stroke: #3b4a5f; }
  #dag .node.array rect { fill: #1e3531; stroke: #2f5a4d; }
  #dag .node.implicit rect { stroke-dasharray: 4 3; }
  #dag .node.selected rect { stroke: var(--accent); stroke-width: 2; }
  #dag .node text { fill: var(--text); font: 12px var(--mono); pointer-events: none; }
  #dag .node .sub { fill: var(--muted); font-size: 10px; }
  #dag .node .badge { fill: var(--accent); font-size: 13px; }
  #dag .node:hover rect { stroke: var(--accent); }

  /* JSON panel */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 12px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .section-header:first-child { margin-top: 0; }
  .section-header code { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .hint { color: var(--muted); }
  details { margin: 4px 0; }
  summary {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 2px;
    border-radius: 5px;
  }
  summary:hover { background: var(--panel-2); }
  summary code { font-family: var(--mono); font-size: 12px; }
  .chip {
    font: 10px var(--mono);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 7px;
    white-space: nowrap;
  }
  .chip-inline { color: var(--ok); border-color: #2f5a4d; }
  .chip-b64 { color: #d8a657; border-color: #5a4a2f; }
  .editor textarea {
    width: 100%;
    min-height: 130px;
    max-height: 45vh;
    resize: vertical;
    background: #12151a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font: 12px/1.5 var(--mono);
    white-space: pre;
  }
  .editor-buttons { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; }
  .editor-status { font: 12px var(--mono); color: var(--muted); }
  .editor-status.ok { color: var(--ok); }
  .editor-status.error { color: var(--error); }

  /* display panel */
  .node-title { margin: 0 0 8px; font-size: 15px; }
  .node-title code { font-family: var(--mono); color: var(--accent); }
  .node-title .sub { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card .name { font-family: var(--mono); font-size: 13px; }
  .card .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  pre.attrs {
    background: #12151a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font: 12px/1.5 var(--mono);
    overflow: auto;
    max-height: 30vh;
  }

  /* viewer */
  .viewer-controls { flex: none; margin-bottom: 8px; }
  .dim-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .dim-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .dim-row code { font-family: var(--mono); min-width: 2.5em; text-align: right; }
  .dim-name { font-family: var(--mono); font-size: 12px; min-width: 7em; color: var(--muted); }
  .range-input { width: 7em; background: #12151a; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; font: 12px var(--mono); }
  .viewer-viewport {
    position: relative;
    flex: 1;
    min-height: 240px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 8px;
    touch-action: none;
    cursor: grab;
  }
  .viewer-viewport:active { cursor: grabbing; }
  .checker {
    background-image:
      linear-gradient(45deg, #20242b 25%, transparent 25%, transparent 75%, #20242b 75%),
      linear-gradient(45deg, #20242b 25%, transparent 25%, transparent 75%, #20242b 75%);
    background-color: #191d23;
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  .viewer-viewport canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    image-rendering: pixelated;
  }
  .viewer-viewport canvas.viewer-overlay {
    width: 100%;
    height: 100%;
    image-rendering: auto;
    pointer-events: none;
  }
  .dim-row label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .viewer-readout {
    flex: none;
    margin-top: 6px;
    font: 12px var(--mono);
    color: var(--muted);
    min-height: 1.4em;
  }
  .value-table { border-collapse: collapse; font: 12px var(--mono); }
  .value-table td { border: 1px solid var(--border); padding: 2px 8px; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.72);
    display: grid;
    place-items: center;
    z-index: 20;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    width: min(680px, 90vw);
  }
  .modal p { margin: 0 0 8px; }
  .modal textarea {
    width: 100%;
    height: 40vh;
    resize: vertical;
    background: #12151a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font: 12px/1.5 var(--mono);
    white-space: pre;
  }
  .drop-active::after {
    content: "drop a zarr-inline .json document";
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(20, 23, 28, 0.85);
    color: var(--accent);
    font-size: 22px;
    z-index: 10;
  }
</style>
</head>
<body>
<header>
  <h1><code>zarr-inline</code> browser</h1>
  <button id="open">Open…</button>
  <input id="file" type="file" accept=".json,application/json" hidden />
  <button id="paste">Paste…</button>
  <button id="from-url">URL…</button>
  <button id="demo">Demo</button>
  <button id="download">Download</button>
  <button id="copy">Copy JSON</button>
  <button id="copy-link">Copy link</button>
  <span id="status">no document</span>
</header>
<main>
  <aside id="dag-panel"><svg id="dag" xmlns="http://www.w3.org/2000/svg"></svg></aside>
  <section id="json-panel"><p class="hint">Open a document to begin.</p></section>
  <section id="display-panel"><p class="hint">The selected node is displayed here.</p></section>
</main>
<script>
/*__APP__*/
</script>
</body>
</html>
