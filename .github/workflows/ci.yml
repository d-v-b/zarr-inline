name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (zarr-python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync
        working-directory: python
      # Cross-implementation tests run in the `cross` job with all toolchains.
      - run: uv run pytest -q --ignore=tests/test_conformance_property.py --ignore=tests/test_crosscheck.py
        working-directory: python

  typescript:
    name: TypeScript (zarrita)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # >= 21 for JSON.parse reviver source access (BigInt)
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript

  rust:
    name: Rust (zarrs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      # The conformance harness must stay buildable without the zarrs feature.
      - run: cargo build --no-default-features --bin conformance
        working-directory: rust

  cross:
    name: Cross-implementation (property test + crosscheck matrix)
    runs-on: ubuntu-latest
    needs: [python, typescript, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build TypeScript harnesses
        run: npm ci && npm run build
        working-directory: typescript
      - name: Build Rust harnesses
        run: cargo build --bins
        working-directory: rust
      - run: uv sync
        working-directory: python
      - name: Property test and writer x reader matrix
        run: uv run pytest -q tests/test_conformance_property.py tests/test_crosscheck.py
        working-directory: python
        env:
          # A missing harness must fail the job, never skip the tests.
          ZARR_JSON_REQUIRE_HARNESSES: "1"
