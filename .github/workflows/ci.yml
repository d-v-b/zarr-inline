name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (zarr-python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      # Cross-implementation tests run in the `cross` job with all toolchains.
      - run: just test-python
      - run: just docs-check

  typescript:
    name: TypeScript (zarrita)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Supported baseline for JSON.parse reviver source access (BigInt)
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/examples/browser/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just test-typescript
      - run: just test-browser-example

  rust:
    name: Rust (zarrs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just test-rust
      - run: just lint-rust
      # The conformance harness must stay buildable without the zarrs feature.
      - run: just build-rust-conformance-minimal

  cross:
    name: Cross-implementation (documents + arrays + operation traces)
    runs-on: ubuntu-latest
    needs: [python, typescript, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - name: Cross-implementation conformance
        run: just cross

  release-artifacts:
    name: Release artifacts (wheel + npm package + crate)
    runs-on: ubuntu-latest
    needs: [python, typescript, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just check-release-artifacts

  docs-deploy:
    name: Docs (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/examples/browser/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just docs-check
      # Publish the site root on the gh-pages branch; previews/ survives.
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          bash .github/scripts/deploy-gh-pages.sh "$GITHUB_WORKSPACE/site" ""
          "docs deploy ${GITHUB_SHA}"

  docs-preview:
    name: Docs preview (PR)
    # Same-repo PRs only: fork PRs get a read-only token anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/examples/browser/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just docs-check
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          bash .github/scripts/deploy-gh-pages.sh "$GITHUB_WORKSPACE/site"
          "previews/pr-${{ github.event.number }}"
          "docs preview PR ${{ github.event.number }} @ ${GITHUB_SHA}"
      - name: Sticky preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          BASE="https://d-v-b.github.io/zarr-inline/previews/pr-${PR}"
          BODY="<!-- docs-preview -->📖 **Docs preview**: ${BASE}/ · **[viewer](${BASE}/viewer/)** · [demo](${BASE}/viewer/#url=demo-document.json) — rebuilt on every push to this PR. _(automated comment)_"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[] | select(.body | startswith("<!-- docs-preview -->")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -f body="$BODY" > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" > /dev/null
          fi
