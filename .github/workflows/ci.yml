name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (zarr-python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      # Cross-implementation tests run in the `cross` job with all toolchains.
      - run: just test-python
      - run: just docs-check

  typescript:
    name: TypeScript (zarrita)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Supported baseline for JSON.parse reviver source access (BigInt)
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/examples/browser/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just test-typescript
      - run: just test-browser-example

  rust:
    name: Rust (zarrs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just test-rust
      - run: just lint-rust
      # The conformance harness must stay buildable without the zarrs feature.
      - run: just build-rust-conformance-minimal

  cross:
    name: Cross-implementation (documents + arrays + operation traces)
    runs-on: ubuntu-latest
    needs: [python, typescript, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - name: Cross-implementation conformance
        run: just cross

  release-artifacts:
    name: Release artifacts (wheel + npm package + crate)
    runs-on: ubuntu-latest
    needs: [python, typescript, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just check-release-artifacts

  docs-deploy:
    name: Docs (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/examples/browser/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just docs-check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  docs-preview:
    name: Docs preview (PR)
    # Same-repo PRs only: preview deploys run with Pages write access.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/examples/browser/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"
      - run: just docs-check
      # The viewer is one self-contained file: downloadable preview that
      # works even where Pages preview deployments are unavailable.
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-single-file
          path: typescript/examples/browser/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true
